<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Consulta de documentos disponibles</title>
<style>
:root{--fondo:#f4f5f7;--carta:#fff;--texto:#1d2330;--suave:#5b6474;--borde:#d9dde4;--acento:#1f3a68;--ok:#1d6b3a;--okf:#e8f4ec;--no:#3d4554;--nof:#eef0f3;--avf:#fdf3e1;--av:#7a4d00}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--fondo);color:var(--texto);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.card{width:100%;max-width:520px;background:var(--carta);border:1px solid var(--borde);border-top:4px solid var(--acento);border-radius:10px;padding:28px 24px}
.inst{margin:0 0 4px;font-size:.85rem;color:var(--suave);text-transform:uppercase;letter-spacing:.04em}
h1{margin:0 0 18px;font-size:1.4rem}
label{display:block;font-weight:600;margin-bottom:6px}
.fila{display:flex;gap:8px}
input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--borde);border-radius:6px;font:inherit}
input:focus{outline:2px solid var(--acento);outline-offset:1px}
button{background:var(--acento);color:#fff;border:0;border-radius:6px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.res{margin-top:18px;padding:14px 16px;border-radius:6px;background:var(--nof);color:var(--no)}
.res p{margin:0 0 6px}
.res.si{background:var(--okf);color:var(--ok)}
.res.si a{color:var(--ok);font-weight:700;word-break:break-all}
.res.aviso{background:var(--avf);color:var(--av)}
.nota{margin:22px 0 0;font-size:.8rem;color:var(--suave)}
</style>
</head>
<body>
<main class="card">
  <p class="inst" id="inst"></p>
  <h1 id="tit"></h1>
  <form id="f" autocomplete="off">
    <label for="q" id="et"></label>
    <div class="fila">
      <input id="q" type="text" inputmode="text" autocapitalize="characters" spellcheck="false">
      <button id="b" type="submit">Consultar</button>
    </div>
  </form>
  <div id="r" class="res" role="status" aria-live="polite" hidden></div>
  <p class="nota">El dato que usted ingresa se verifica en su propio dispositivo: no se envía ni se guarda en ningún lugar.
  Listado actualizado al <span id="fe"></span>.</p>
</main>
<script>
var C = {"inst":"Embajada del Ecuador en Alemania · Sección Consular","t":"Consulta de documentos disponibles","et":"Número de cédula o pasaporte","ph":"Ej.: 1712345678","correo":"cecuberlin@cancilleria.gob.ec","si":"Existe un documento a su nombre. Por favor, comuníquese al siguiente correo:","no":"No existe un documento registrado con ese dato. Se realizan actualizaciones periódicas.","fecha":"12 de octubre de 2026","sal":"924fa65b42e21a9651349632b7eb450d","it":100000,"len":5,"cero":true,"h":["00e76","02bbf","03ac6","04174","0435d","046c1","055b0","06641","0792d","079f9","07eef","0893d","0a356","0a743","0b55b","0bd70","0cbe5","0d0c7","0d962","0e83c","0fb6b","0fe7c","10319","105e1","12886","13342","1350a","135e4","13a04","165ac","16ea9","187f2","1944a","1a919","1bbf4","1d460","1e18e","1e734","1eade","1ef9d","1fb40","20e91","223d7","22525","23603","2452e","261f0","263fa","273f1","27edc","2859b","285d0","28b14","28d36","2ca15","2dfa6","316fe","32240","3354b","34ee7","360c4","36ece","37af0","37b52","39593","39c05","39cf8","3a5dd","3acec","3b283","3b5fa","3c057","3dba2","3e0b2","3eb27","3ec93","3f2a8","3f465","4068f","40cd4","41167","416a7","4170f","420bd","45a66","45c1b","47953","48b28","4b250","4d392","4db15","4ff75","509a7","5110f","52fcc","5462a","56713","567bb","57448","57b4d","5ac15","5c5c7","5cced","5dfba","5f5ee","615b5","61e46","620a3","62f85","64fe6","653a7","6693a","66d40","6895b","689af","6940b","6bc66","6c8e7","6dd38","6f074","6fae6","70c23","7278e","73062","73622","73961","74313","74c48","74e85","77bd7","77e06","78286","784c9","79b59","7aac9","7b0c4","7c02a","7cb98","7e127","7e491","7e64b","7f3b2","7fdd3","7ff3e","8068e","80cd9","81021","8225d","83c08","842e8","85d6f","86d25","871b8","87bc1","87c82","87d62","8846a","88ce5","895db","8a407","8a6fd","8a7d6","8d362","8fa7d","90a11","90e0a","92ff3","93167","9346e","948c7","969e6","973bf","98462","99651","99b26","99bb5","9a3ba","9be64","9bf82","9c5ae","9ce5e","9f0e6","9f487","a0cd2","a224d","a254b","a35b4","a3920","a4858","a746b","a773b","a7f7e","a8942","a8aee","a8edb","a94ef","a9c2a","abe2a","ac271","ac5d3","aee7c","aefe7","afca4","affad","b0cdc","b12d8","b1bae","b26e1","b3d3e","b5c0b","b71f4","b7954","b843b","b87cf","b9183","b94d7","bb62c","bb99d","bce4e","bd0c4","be50e","bee7b","bf10c","bf4c6","c29d9","c3069","c3db9","c720f","c780d","c799f","c7f9d","c80b6","c96bc","ca874","ccf0d","cec58","ced83","d055d","d0faf","d1153","d2d56","d4025","d477c","d5d61","d7dea","d9cd3","d9dc5","da189","da577","db32e","dc69d","dd1d9","de182","debaa","e20aa","e2cba","e3d88","e422e","e5599","e65dd","e6a49","e758c","e7e39","e7eb7","e941b","eb761","eb99c","eea68","ef588","f0cd0","f2d73","f2d76","f2ed1","f638c","f72e9","f7d1e","f7f3b","f875c","f935d","f9d60","fa7d5","fc388","fc79f","fe556","fea33","ff1d1","ffa5d","ffadc","ffe76"]};
function normalizar(s, cero) {
  var v = String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (cero && /^\d{9}$/.test(v)) v = '0' + v;
  return v;
}
async function derivar(valor, sal, iter, largo) {
  var enc = new TextEncoder();
  var clave = await crypto.subtle.importKey('raw', enc.encode(valor), 'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(sal), iterations: iter, hash: 'SHA-256' }, clave, 256);
  return Array.from(new Uint8Array(bits)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('').slice(0, largo);
}
(function () {
  var H = new Set(C.h);
  var q = document.getElementById('q'), b = document.getElementById('b'), r = document.getElementById('r');
  document.getElementById('inst').textContent = C.inst;
  document.getElementById('tit').textContent = C.t;
  document.getElementById('et').textContent = C.et;
  document.getElementById('fe').textContent = C.fecha;
  q.placeholder = C.ph;
  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    r.hidden = false;
    if (!window.crypto || !crypto.subtle) {
      r.className = 'res aviso';
      r.textContent = 'Su navegador no permite realizar la consulta. Intente con otro navegador o escríbanos a ' + C.correo + '.';
      return;
    }
    var v = normalizar(q.value, C.cero);
    if (v.length < 3) {
      r.className = 'res aviso';
      r.textContent = 'Ingrese un dato válido.';
      return;
    }
    b.disabled = true;
    r.className = 'res';
    r.textContent = 'Consultando…';
    var t0 = Date.now();
    var h = await derivar(v, C.sal, C.it, C.len);
    var espera = 700 - (Date.now() - t0);
    if (espera > 0) await new Promise(function (ok) { setTimeout(ok, espera); });
    b.disabled = false;
    r.replaceChildren();
    if (H.has(h)) {
      r.className = 'res si';
      var p = document.createElement('p');
      p.textContent = C.si;
      var a = document.createElement('a');
      a.href = 'mailto:' + C.correo + '?subject=' + encodeURIComponent('Consulta de documento');
      a.textContent = C.correo;
      r.append(p, a);
    } else {
      r.className = 'res';
      r.textContent = C.no;
    }
  });
})();
</script>
</body>
</html>
